name: Deploy

on:
  push:
    branches:
      - master

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t yumikokawaii/akashic:latest .

      - name: Save image to tar
        run: |
          docker save yumikokawaii/akashic:latest -o akashic.tar
          chmod 644 akashic.tar

      - name: Find runner IP
        id: runner
        run: echo "ip=$(curl -fsS --retry 3 https://api.ipify.org)" >> "$GITHUB_OUTPUT"

      - name: Allow runner through the SSH rate limit
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: sudo -n ufw insert 1 allow from ${{ steps.runner.outputs.ip }} to any port 22 proto tcp comment 'github-actions-deploy'

      - name: Copy image and compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "akashic.tar,docker-compose.yml"
          target: /tmp/

      - name: Load image and restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker load -i /tmp/akashic.tar
            rm -f /tmp/akashic.tar

            mkdir -p ~/akashic
            mv /tmp/docker-compose.yml ~/akashic/docker-compose.yml

            cd ~/akashic
            docker compose up -d

            docker image prune -f

      - name: Remove runner firewall rule
        if: always() && steps.runner.outputs.ip != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: sudo -n ufw delete allow from ${{ steps.runner.outputs.ip }} to any port 22 proto tcp || true
