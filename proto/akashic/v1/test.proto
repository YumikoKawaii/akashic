syntax = "proto3";
package akashic.v1;

import "google/protobuf/timestamp.proto";
import "akashic/v1/common.proto";
import "akashic/v1/question.proto";

option go_package = "github.com/yumikokawaii/akashic/gen/akashic/v1;akashicv1";

service TestService {
  rpc ListTests    (ListTestsRequest)    returns (ListTestsResponse);
  rpc GenerateTest (GenerateTestRequest) returns (GenerateTestResponse);
  rpc GetTest      (GetTestRequest)      returns (GetTestResponse);
  rpc DeleteTest   (DeleteTestRequest)   returns (DeleteTestResponse);
  rpc RestoreTest  (RestoreTestRequest)  returns (RestoreTestResponse);
}

message TestQuestion {
  int32    test_id = 1;
  int32    question_id = 2;
  int32    position = 3;
  Question question = 4;
}

message Test {
  int32                     id = 1;
  int32                     bank_id = 2;
  string                    name = 3;
  string                    description = 4;
  TestConfig                config = 5;
  repeated TestQuestion     questions = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  optional int32            created_by = 9; // the generator's user id
  optional User             creator = 10;   // embedded generator
}

message ListTestsRequest {
  int32 bank_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}
message ListTestsResponse {
  repeated Test tests = 1;
  PageInfo      page_info = 2;
}

message GenerateTestRequest {
  int32      bank_id = 1;
  string     name = 2;
  string     description = 3;
  TestConfig config = 4;
}
message GenerateTestResponse {Test test = 1;}

message GetTestRequest  {int32 bank_id = 1; int32 id = 2;}
message GetTestResponse {Test test = 1;}

message DeleteTestRequest  {int32 bank_id = 1; int32 id = 2;}
message DeleteTestResponse {}

message RestoreTestRequest  {int32 bank_id = 1; int32 id = 2;}
message RestoreTestResponse {Test test = 1;}
