syntax = "proto3";
package akashic.v1;

import "google/protobuf/timestamp.proto";
import "akashic/v1/common.proto";
import "akashic/v1/question.proto";

option go_package = "github.com/yumikokawaii/akashic/gen/akashic/v1;akashicv1";

service ContributionService {
  rpc SubmitContribution   (SubmitContributionRequest)   returns (SubmitContributionResponse);
  rpc UpdateContribution   (UpdateContributionRequest)   returns (UpdateContributionResponse);
  rpc ListMyContributions  (ListMyContributionsRequest)  returns (ListMyContributionsResponse);
  rpc TransitionContribution (TransitionContributionRequest) returns (TransitionContributionResponse);
  rpc MergeContribution    (MergeContributionRequest)    returns (MergeContributionResponse);
  rpc ListContributions    (ListContributionsRequest)    returns (ListContributionsResponse);
  rpc ReviewContribution   (ReviewContributionRequest)   returns (ReviewContributionResponse);
  rpc AddContributionComment (AddContributionCommentRequest) returns (AddContributionCommentResponse);
}

enum ContributionStatus {
  CONTRIBUTION_STATUS_UNSPECIFIED       = 0;
  CONTRIBUTION_STATUS_PENDING           = 1;
  CONTRIBUTION_STATUS_CHANGES_REQUESTED = 2;
  CONTRIBUTION_STATUS_APPROVED          = 3; // >=1 approve, awaiting contributor merge
  CONTRIBUTION_STATUS_REJECTED          = 4; // reviewer rejected; contributor may reopen
  CONTRIBUTION_STATUS_MERGED            = 5; // terminal — question created
  CONTRIBUTION_STATUS_WITHDRAWN         = 6; // contributor pulled back; may reopen
  CONTRIBUTION_STATUS_CLOSED            = 7; // terminal — contributor abandoned
}

// ContributionEventType is every state transition recorded on a contribution's
// event log. APPROVE/REJECT/REQUEST_CHANGES are reviewer (editor) actions; the
// rest are contributor actions. The log carries no prose — explanations are
// comments.
enum ContributionEventType {
  CONTRIBUTION_EVENT_TYPE_UNSPECIFIED     = 0;
  CONTRIBUTION_EVENT_TYPE_APPROVE         = 1; // reviewer  -> approved (contributor then merges)
  CONTRIBUTION_EVENT_TYPE_REJECT          = 2; // reviewer  -> rejected
  CONTRIBUTION_EVENT_TYPE_REQUEST_CHANGES = 3; // reviewer  -> changes_requested
  CONTRIBUTION_EVENT_TYPE_REVISE          = 4; // contributor edited -> pending
  CONTRIBUTION_EVENT_TYPE_MERGE           = 5; // contributor landed -> merged
  CONTRIBUTION_EVENT_TYPE_RESUBMIT        = 6; // contributor re-requests review (no edit) -> pending
  CONTRIBUTION_EVENT_TYPE_WITHDRAW        = 7; // contributor -> withdrawn
  CONTRIBUTION_EVENT_TYPE_REOPEN          = 8; // contributor (withdrawn|rejected) -> pending
  CONTRIBUTION_EVENT_TYPE_CLOSE           = 9; // contributor -> closed (terminal)
}

// ── Entities ────────────────────────────────────────────────────────────────

// ProposedQuestion is the proposed new question — mirrors CreateQuestionRequest content.
message ProposedQuestion {
  int32           category_id = 1;
  QuestionType    type = 2;
  Difficulty      difficulty = 3;
  repeated string tags = 4;
  oneof content {
    QuestionItem   item = 5;
    MultipleChoice choice = 6;
  }
}

// ContributionEvent is one state transition on a contribution — prose-free.
message ContributionEvent {
  int32                     id = 1;
  int32                     actor_id = 2;
  ContributionEventType     event = 3;
  google.protobuf.Timestamp created_at = 4;
  optional User             actor = 5;
}

// ContributionComment is free-form discussion on a contribution (no decision).
// Any viewer can post; the contributor uses it to defend or clarify a proposal.
message ContributionComment {
  int32                     id = 1;
  int32                     author_id = 2;
  string                    body = 3;
  google.protobuf.Timestamp created_at = 4;
  optional User             author = 5;
}

message Contribution {
  int32                        id = 1;
  int32                        bank_id = 2;
  int32                        contributor_id = 3;
  ProposedQuestion             proposed = 4;
  ContributionStatus           status = 5;
  optional int32               question_id = 6; // the question created on merge
  repeated ContributionEvent   events = 7;       // 1-n state-change log, oldest -> newest
  repeated ContributionComment comments = 11;    // 1-n discussion, oldest -> newest
  google.protobuf.Timestamp    created_at = 8;
  google.protobuf.Timestamp    updated_at = 9;
  optional User                contributor = 10;
}

// ── Submit / Update ───────────────────────────────────────────────────────────

message SubmitContributionRequest  { int32 bank_id = 1; ProposedQuestion proposed = 2; }
message SubmitContributionResponse { Contribution contribution = 1; }

// Contributor revises a non-terminal contribution -> reopens to pending.
message UpdateContributionRequest  { int32 bank_id = 1; int32 id = 2; ProposedQuestion proposed = 3; }
message UpdateContributionResponse { Contribution contribution = 1; }

// ── List (mine) / Withdraw / Merge ──────────────────────────────────────────────

message ListMyContributionsRequest  { int32 bank_id = 1; } // caller's own, this bank
message ListMyContributionsResponse { repeated Contribution contributions = 1; }

// Contributor-driven status transition: RESUBMIT / WITHDRAW / REOPEN / CLOSE.
// Validated against the current state + contributor ownership.
message TransitionContributionRequest  { int32 bank_id = 1; int32 id = 2; ContributionEventType action = 3; }
message TransitionContributionResponse { Contribution contribution = 1; }

// Contributor-only; allowed only when status == approved. Creates the question.
message MergeContributionRequest  { int32 bank_id = 1; int32 id = 2; }
message MergeContributionResponse { Contribution contribution = 1; }

// ── Review queue (editor+) ──────────────────────────────────────────────────────

message ListContributionsRequest  { int32 bank_id = 1; ContributionStatus status = 2; } // status optional filter
message ListContributionsResponse { repeated Contribution contributions = 1; }

// Records one reviewer decision (APPROVE / REJECT / REQUEST_CHANGES only). Carries
// no prose — a reviewer who wants to explain posts a comment.
message ReviewContributionRequest {
  int32                 bank_id = 1;
  int32                 id = 2;
  ContributionEventType decision = 3;
}
message ReviewContributionResponse { Contribution contribution = 1; }

// ── Comments (any viewer) ─────────────────────────────────────────────────────────

// Posts a free-form comment on a contribution. id is the contribution id.
message AddContributionCommentRequest  { int32 bank_id = 1; int32 id = 2; string body = 3; }
message AddContributionCommentResponse { Contribution contribution = 1; }
