syntax = "proto3";
package akashic.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/yumikokawaii/akashic/gen/akashic/v1;akashicv1";

service CategoryService {
  rpc ListCategories  (ListCategoriesRequest)  returns (ListCategoriesResponse);
  rpc CreateCategory  (CreateCategoryRequest)  returns (CreateCategoryResponse);
  rpc UpdateCategory  (UpdateCategoryRequest)  returns (UpdateCategoryResponse);
  rpc DeleteCategory  (DeleteCategoryRequest)  returns (DeleteCategoryResponse);
  rpc RestoreCategory (RestoreCategoryRequest) returns (RestoreCategoryResponse);
}

message Category {
  int32                     id          = 1;
  int32                     bank_id     = 2;
  string                    name        = 3;
  string                    description = 4;
  google.protobuf.Timestamp created_at  = 5;
  google.protobuf.Timestamp updated_at  = 6;
}

message ListCategoriesRequest  { int32 bank_id = 1; }
message ListCategoriesResponse { repeated Category categories = 1; }

message CreateCategoryRequest {
  int32  bank_id     = 1;
  string name        = 2;
  string description = 3;
}
message CreateCategoryResponse { Category category = 1; }

message UpdateCategoryRequest {
  int32  bank_id     = 1;
  int32  id          = 2;
  string name        = 3;
  string description = 4;
}
message UpdateCategoryResponse { Category category = 1; }

message DeleteCategoryRequest  { int32 bank_id = 1; int32 id = 2; }
message DeleteCategoryResponse {}

message RestoreCategoryRequest  { int32 bank_id = 1; int32 id = 2; }
message RestoreCategoryResponse { Category category = 1; }
