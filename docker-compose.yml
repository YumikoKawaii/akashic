x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: yumikokawaii/akashic:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    environment:
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_USER:     ${DB_USER:-akashic}
      DB_PASSWORD: ${DB_PASSWORD:-akashic}
      DB_NAME:     ${DB_NAME:-akashic}
      DB_SCHEMA:   ${DB_SCHEMA:-akashic}
      DB_SSLMODE:  disable
      REDIS_HOST:  redis
      REDIS_PORT:  6379
      SERVER_PORT: 8080
      STATIC_DIR:  ./static
      GOOGLE_CLIENT_ID:     ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL:  ${GOOGLE_CALLBACK_URL}
      JWT_SECRET:           ${JWT_SECRET}
      FRONTEND_URL:         ${FRONTEND_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    logging: *logging
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     ${DB_USER:-akashic}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-akashic}
      POSTGRES_DB:       ${DB_NAME:-akashic}
    command:
      - postgres
      - -c
      - max_wal_size=256MB
      - -c
      - min_wal_size=64MB
      - -c
      - wal_compression=lz4
      - -c
      - default_toast_compression=lz4
      - -c
      - autovacuum_naptime=30s
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.02
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=40
    configs:
      - source: initdb
        target: /docker-entrypoint-initdb.d/01-schema.sql
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    logging: *logging
    restart: unless-stopped

configs:
  initdb:
    content: |
      CREATE SCHEMA IF NOT EXISTS ${DB_SCHEMA:-akashic} AUTHORIZATION ${DB_USER:-akashic};

volumes:
  pgdata:
